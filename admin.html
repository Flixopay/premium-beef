<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Matador Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: barra lateral clara → barra superior con búsqueda global → vista con banner fotográfico, resumen e infografías; detalle en panel lateral deslizante */
:root{
  --bg:#F6F1EE;--surface:#FFFFFF;--surface-2:#FBF7F5;--sunk:#EFE7E3;--ink:#2B1D1E;--ink-2:#6F5C5C;--ink-3:#9C8A89;--line:#E9DEDA;
  --wine:#9C3B40;--wine-soft:#F4E1E0;--gold:#C49A4A;--gold-soft:#F6EBD6;--sage:#5F8A6A;--sage-soft:#E2EDE4;--sky:#5E82A8;--sky-soft:#E1EAF3;--plum:#7D5A86;--plum-soft:#EDE3F0;
  --warn:#B07A1F;--warn-soft:#F8ECD2;--bad:#B5413F;--bad-soft:#F7DEDC;
  --shadow:0 1px 2px rgba(60,30,30,.05),0 10px 30px -18px rgba(60,30,30,.22);
  --font-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --font-ui:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:14px;--ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#171113;--surface:#1F181A;--surface-2:#231B1D;--sunk:#2A2124;--ink:#F2E8E5;--ink-2:#BCA9A6;--ink-3:#8C7A78;--line:#352A2D;
  --wine:#D9686D;--wine-soft:#3A2224;--gold:#DDB66A;--gold-soft:#3A2F1C;--sage:#8FBF9A;--sage-soft:#1E2C22;--sky:#8DB0D6;--sky-soft:#1C2633;--plum:#B897C2;--plum-soft:#2D2231;
  --warn:#E5B866;--warn-soft:#3A2E17;--bad:#EF8E8B;--bad-soft:#3D1D1D;--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -18px rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171113;--surface:#1F181A;--surface-2:#231B1D;--sunk:#2A2124;--ink:#F2E8E5;--ink-2:#BCA9A6;--ink-3:#8C7A78;--line:#352A2D;
  --wine:#D9686D;--wine-soft:#3A2224;--gold:#DDB66A;--gold-soft:#3A2F1C;--sage:#8FBF9A;--sage-soft:#1E2C22;--sky:#8DB0D6;--sky-soft:#1C2633;--plum:#B897C2;--plum-soft:#2D2231;
  --warn:#E5B866;--warn-soft:#3A2E17;--bad:#EF8E8B;--bad-soft:#3D1D1D;--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -18px rgba(0,0,0,.6);color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:14px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid color-mix(in srgb,var(--gold) 70%,transparent);outline-offset:2px;border-radius:6px}
h1,h2,h3,h4{margin:0;text-wrap:balance}
p{margin:0}
.num,.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}.faint{color:var(--ink-3)}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.disp{font-family:var(--font-display);text-transform:uppercase;letter-spacing:.02em;line-height:1}

/* Shell */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow:auto;padding:18px 14px 18px max(14px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 10px}
.brand .mk{width:38px;height:38px;border-radius:11px;background:var(--wine);color:#fff;display:grid;place-items:center;flex:none}
.brand .mk svg{width:24px;height:24px}
.brand b{font-family:var(--font-display);font-weight:900;font-size:20px;letter-spacing:.05em;display:block;line-height:1}
.brand small{font-size:11px;color:var(--ink-3)}
.nav{display:grid;gap:2px}
.nav .g{font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);padding:12px 10px 4px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;text-decoration:none;color:var(--ink-2);font-weight:600;transition:background .2s,color .2s}
.nav a svg{width:18px;height:18px;flex:none;opacity:.8}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--wine-soft);color:var(--wine)}
.nav a .b{margin-left:auto;font-family:var(--font-mono);font-size:11px;background:var(--wine);color:#fff;border-radius:9px;padding:0 7px;min-width:20px;text-align:center}
.side .foot{margin-top:auto;display:grid;gap:8px;font-size:12px;color:var(--ink-3);padding:0 8px}
.side .foot button{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:7px 10px;cursor:pointer;color:var(--ink-2);font-weight:600}

.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar .in{display:flex;align-items:center;gap:12px;padding:10px max(24px,env(safe-area-inset-right,0px)) 10px 24px}
.sbtn{display:flex;align-items:center;gap:10px;flex:1;max-width:460px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 12px;color:var(--ink-3);cursor:pointer;text-align:left;transition:border-color .2s,box-shadow .2s}
.sbtn:hover{border-color:var(--ink-3);box-shadow:var(--shadow)}
.sbtn svg{width:16px;height:16px}
.sbtn kbd{margin-left:auto;font-family:var(--font-mono);font-size:11px;border:1px solid var(--line);border-radius:6px;padding:1px 6px;background:var(--surface-2)}
.who{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:13px}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12px;flex:none;color:#fff}
main{min-width:0;padding:22px max(24px,env(safe-area-inset-right,0px)) 80px max(24px,env(safe-area-inset-left,0px))}

/* Bloques */
.vhead{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.vhead h1{font-family:var(--font-display);font-weight:900;font-size:42px;text-transform:uppercase;letter-spacing:.02em;line-height:1}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.card>header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px 0;flex-wrap:wrap}
.card>header h3{font-size:15px;font-weight:700}
.card .pb{padding:14px 18px 18px}
.grid2{display:grid;grid-template-columns:1.65fr 1fr;gap:16px}
.grid2e{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.stack{display:grid;gap:16px}
@media (max-width:1150px){.grid2,.grid2e{grid-template-columns:1fr}}

.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap;color:var(--ink);transition:transform .15s var(--ease),box-shadow .2s,background .2s,border-color .2s}
.btn:hover{border-color:var(--ink-3);box-shadow:var(--shadow)}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--wine);border-color:var(--wine);color:#fff}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.seg{display:inline-flex;background:var(--sunk);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:5px 11px;border-radius:8px;cursor:pointer;font-weight:600;font-size:12.5px;color:var(--ink-2);transition:background .2s,color .2s,box-shadow .2s}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}

.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-ok{background:var(--sage-soft);color:var(--sage)}.p-warn{background:var(--warn-soft);color:var(--warn)}
.p-bad{background:var(--bad-soft);color:var(--bad)}.p-info{background:var(--sky-soft);color:var(--sky)}
.p-mute{background:var(--sunk);color:var(--ink-2)}.p-gold{background:var(--gold-soft);color:var(--warn)}.p-plum{background:var(--plum-soft);color:var(--plum)}
.tag{font-size:11px;font-weight:700;padding:1px 8px;border-radius:6px;background:var(--sunk);color:var(--ink-2);white-space:nowrap}
.tag.wagyu{background:var(--gold-soft);color:var(--warn)}

/* Banner fotográfico */
.banner{position:relative;overflow:hidden;border-radius:18px;min-height:190px;display:flex;align-items:flex-end;color:#F7EDE9;isolation:isolate;margin-bottom:16px;box-shadow:var(--shadow)}
.banner img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;transition:transform 1.2s var(--ease)}
.banner:hover img{transform:scale(1.03)}
.banner::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(24,14,14,.92) 25%,rgba(24,14,14,.45) 60%,rgba(24,14,14,.1))}
.banner .in{padding:22px 24px;display:grid;gap:8px;width:100%}
.banner h2{font-family:var(--font-display);font-size:40px;font-weight:900;text-transform:uppercase;line-height:1}
.banner p{color:#D8C7C2;max-width:56ch}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(6px);border-radius:999px;padding:6px 12px;text-decoration:none;color:#fff;font-weight:600;font-size:12.5px;transition:background .2s,transform .2s var(--ease)}
.chip:hover{background:rgba(255,255,255,.22);transform:translateY(-1px)}
.chip b{font-family:var(--font-mono);font-weight:500}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{padding:14px 16px;display:grid;gap:4px}
.kpi .l{font-size:12px;font-weight:600;color:var(--ink-2)}
.kpi .v{font-family:var(--font-mono);font-size:22px;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi .d{font-size:12px;font-weight:600}
.up{color:var(--sage)}.down{color:var(--bad)}
.spark{width:100%;height:30px;display:block}
@media (max-width:1250px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:700px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* Gráficas */
.chartbox{position:relative}
svg.ch{display:block;width:100%;height:auto;overflow:visible}
svg.ch text{fill:var(--ink-3);font-family:var(--font-mono);font-size:10.5px}
svg.ch .grid{stroke:var(--line);stroke-width:1}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);font-weight:600}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.brush{position:relative;user-select:none;touch-action:none;cursor:crosshair}
.brush svg{display:block;width:100%;height:58px}
.tip{position:fixed;z-index:95;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:10px;padding:8px 10px;font-size:12px;box-shadow:0 10px 30px -10px rgba(0,0,0,.4);opacity:0;transform:translateY(4px);transition:opacity .15s,transform .15s;max-width:260px}
.tip.show{opacity:1;transform:none}
.tip b{display:block;margin-bottom:2px}
.tip .r{display:flex;justify-content:space-between;gap:14px;font-family:var(--font-mono)}
.donut path{transition:transform .25s var(--ease),opacity .2s;transform-origin:center;transform-box:view-box;cursor:pointer}
.donut path.dim{opacity:.35}
.dleg{display:grid;gap:8px}
.dleg button{display:flex;align-items:center;gap:10px;border:0;background:transparent;padding:6px 8px;border-radius:8px;cursor:pointer;text-align:left;transition:background .2s}
.dleg button:hover{background:var(--surface-2)}
.dleg i{width:10px;height:10px;border-radius:3px;flex:none}
.dleg span{flex:1;font-weight:600}
.hm{display:grid;gap:3px}
.hm .row{display:grid;grid-template-columns:34px repeat(var(--cols),1fr);gap:3px;align-items:center}
.hm .row span{font-size:10.5px;color:var(--ink-3);font-family:var(--font-mono)}
.hm i{aspect-ratio:1;border-radius:4px;background:var(--sunk);transition:transform .15s}
.hm i:hover{transform:scale(1.25);outline:2px solid var(--ink)}
.insights{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
.ins{background:var(--surface-2);border-radius:12px;padding:12px 14px;border:1px solid var(--line)}
.ins b{display:block;font-size:15px}
.ins span{font-size:12px;color:var(--ink-2)}
@media (max-width:800px){.insights{grid-template-columns:1fr}}

.bars{display:grid;gap:10px}
.barrow{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;cursor:pointer;padding:4px;border-radius:10px;transition:background .2s}
.barrow:hover{background:var(--surface-2)}
.th{width:44px;height:44px;border-radius:10px;object-fit:cover;display:block;background:#2a1517;overflow:hidden}
.th canvas{width:44px;height:44px;display:block}
.barrow .nm{font-weight:700;font-size:13px;display:flex;justify-content:space-between;gap:8px}
.track{height:8px;border-radius:6px;background:var(--sunk);overflow:hidden;margin-top:6px}
.track i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--wine),color-mix(in srgb,var(--wine) 60%,var(--gold)));transform-origin:left;animation:grow .8s var(--ease) both}
@keyframes grow{from{transform:scaleX(0)}}

/* Mapa de calor sobre infografía */
.cow{position:relative;border-radius:12px;overflow:hidden;background:#121212}
.cow img{display:block;width:100%;height:auto}
.cow svg{position:absolute;inset:0;width:100%;height:100%}
.cow polygon{stroke:rgba(255,255,255,.6);stroke-width:2;cursor:pointer;transition:fill .3s,stroke-width .2s}
.cow polygon:hover,.cow polygon.on{stroke:#DDB66A;stroke-width:6}
.cow .lb rect{fill:rgba(18,12,12,.82)}
.cow .lb text{fill:#fff;font-family:var(--font-mono);font-size:26px;font-weight:500}
.cow .lb{pointer-events:none}

/* Tablas */
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:760px}
th{text-align:left;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
th button{border:0;background:transparent;padding:0;font:inherit;color:inherit;letter-spacing:inherit;text-transform:inherit;cursor:pointer;display:inline-flex;gap:4px;align-items:center}
th button[data-dir]::after{content:attr(data-dir);color:var(--wine)}
td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr{cursor:pointer;transition:background .15s}
tbody tr:hover{background:var(--surface-2)}
tr:last-child td{border-bottom:0}
.r{text-align:right}
.cl{display:flex;align-items:center;gap:10px;min-width:0}
.cl .av{width:30px;height:30px;font-size:11px}
.cl b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cl small{display:block;color:var(--ink-3);font-size:11.5px}
.thumbs{display:flex}
.thumbs .th{width:26px;height:26px;border-radius:50%;border:2px solid var(--surface);margin-left:-8px}
.thumbs .th:first-child{margin-left:0}
.thumbs .th canvas{width:26px;height:26px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.inp{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:7px 10px;font-size:13px;color:var(--ink)}
.inp.search{min-width:220px;flex:1;max-width:320px}
.sumbar{display:flex;gap:18px;flex-wrap:wrap;align-items:center;padding:12px 18px;background:var(--surface-2);border-bottom:1px solid var(--line);font-size:13px}
.sumbar b{font-family:var(--font-mono);font-weight:500}
.pager{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 18px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2)}
.empty{padding:30px 18px;text-align:center;color:var(--ink-3)}

/* Kanban */
.kanban{display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:14px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--sunk);border-radius:var(--r);padding:12px;min-height:220px;transition:background .2s,outline-color .2s;outline:2px dashed transparent}
.col.over{background:var(--wine-soft);outline-color:var(--wine)}
.col h4{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);margin-bottom:10px}
.oc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;display:grid;gap:8px;cursor:grab;box-shadow:var(--shadow);transition:transform .2s var(--ease),opacity .2s;animation:pop .3s var(--ease) both}
.oc:hover{transform:translateY(-2px)}
.oc.drag{opacity:.4}
@keyframes pop{from{opacity:0;transform:scale(.97)}}
.oc .t{display:flex;justify-content:space-between;gap:8px;align-items:center}
.oc .meta{font-size:12px;color:var(--ink-2)}
.oc .acts{display:flex;gap:6px;flex-wrap:wrap}

/* Clientes */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.ccard{padding:16px;display:grid;gap:10px;cursor:pointer;transition:transform .2s var(--ease),box-shadow .2s;text-align:left;border:1px solid var(--line);font:inherit;color:inherit;background:var(--surface)}
.ccard:hover{transform:translateY(-3px)}
.ccard .top{display:flex;gap:10px;align-items:center}
.ccard .top b{display:block;font-size:14px}
.ccard .row{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-2)}
.ccard .row b{font-family:var(--font-mono);color:var(--ink);font-weight:500}

/* Inventario */
.inv{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.icard{overflow:hidden;display:grid}
.icard .ph{position:relative;height:120px;background:#2a1517}
.icard .ph img,.icard .ph canvas{width:100%;height:100%;object-fit:cover;display:block}
.icard .ph .tag{position:absolute;top:10px;left:10px}
.icard .ph .ring{position:absolute;right:12px;bottom:-26px;width:64px;height:64px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center}
.icard .ph .ring svg{position:absolute;inset:4px}
.icard .ph .ring b{font-family:var(--font-mono);font-size:12px;font-weight:500}
.icard .bd{padding:14px 16px 16px;display:grid;gap:8px}
.icard h3{font-size:15px;font-weight:800;padding-right:70px}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kv div{background:var(--surface-2);border-radius:10px;padding:6px 8px}
.kv span{display:block;font-size:10.5px;color:var(--ink-3);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.kv b{font-family:var(--font-mono);font-weight:500;font-size:13px}
.lots{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.lot{padding:16px;display:grid;gap:10px}
.yield{display:flex;height:14px;border-radius:7px;overflow:hidden}
.yield i{display:block;height:100%}
.age{height:6px;background:var(--sunk);border-radius:4px;overflow:hidden}
.age i{display:block;height:100%;background:var(--sage);border-radius:4px}

/* Rutas */
.rmap{background:var(--surface-2);border-radius:12px}
.rmap svg{display:block;width:100%;height:auto}
.rmap .river{fill:none;stroke:var(--sky);stroke-width:5;opacity:.35;stroke-linecap:round}
.rmap .zn{cursor:pointer;transition:r .3s}

function marble(cv,density,seed){
  const ctx=cv.getContext("2d");if(!ctx)return;const w=cv.width,h=cv.height,r=rng(seed);
  const g=ctx.createRadialGradient(w*.45,h*.45,4,w/2,h/2,w*.8);g.addColorStop(0,"#AE4045");g.addColorStop(1,"#5E1A1E");
  ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
  for(let v=0;v<Math.round(10+density*60);v++){let x=r()*w,y=r()*h,a=r()*7;ctx.strokeStyle=`rgba(246,232,222,${.5+r()*.45})`;ctx.lineWidth=(.5+r()*(1+density*3))*w/200;ctx.lineCap="round";ctx.beginPath();ctx.moveTo(x,y);
    for(let s=0;s<20+r()*(40+density*100);s+=4){a+=(r()-.5)*.9;x+=Math.cos(a)*4*w/200;y+=Math.sin(a)*4*w/200;ctx.lineTo(x,y)}ctx.stroke()}
}

function niceMax(v){if(v<=0)return 1;const s=Math.pow(10,Math.floor(Math.log10(v)));for(const m of [1,1.5,2,2.5,3,4,5,6,8,10])if(m*s>=v)return m*s;return 10*s}
function spark(vals,col="var(--wine)"){

function donut(parts,id){

function heatmap(weeks){
  const end=T0,start=end-weeks*7*DAY;const cnt={};let mx=1;
  ALL().forEach(o=>{if(o.t>=start&&o.t<end){const k=Math.floor((o.t-start)/DAY);cnt[k]=(cnt[k]||0)+o.tot;mx=Math.max(mx,cnt[k])}});
  const s0=new Date(start).getDay();
  const rows=[1,2,3,4,5,6].map(dw=>{let cells="";for(let w=0;w<weeks;w++){const k=w*7+((dw-s0+7)%7);const t=start+k*DAY;const v=cnt[k]||0;
    const a=v?(.12+.88*Math.pow(v/mx,.8)):0;cells+=`<i style="${v?`background:color-mix(in srgb,var(--wine) ${Math.round(a*100)}%,var(--sunk))`:""}" data-tip="<b>${dlong(t)}</b>${v?km(v):"Sin entregas"}"></i>`}
    return `<div class="row"><span>${DN[dw]}</span>${cells}</div>`}).join("");

  const el=$("#brush");if(!el)return;const n=MONTHS.length;let a=null;
  const idx=e=>{const b=el.getBoundingClientRect();return Math.max(0,Math.min(n-1,Math.floor((e.clientX-b.left)/b.width*n)))};
  const upd=(i0,i1)=>{const s=$("#brSel"),bw=780/n;s.setAttribute("x",Math.min(i0,i1)*bw);s.setAttribute("width",(Math.abs(i1-i0)+1)*bw)};
  el.addEventListener("pointerdown",e=>{a=idx(e);el.setPointerCapture(e.pointerId);upd(a,a)});
  el.addEventListener("pointermove",e=>{if(a!==null)upd(a,idx(e))});
  el.addEventListener("pointerup",e=>{if(a===null)return;const b=idx(e);RANGE=[Math.min(a,b),Math.max(a,b)];if(RANGE[1]-RANGE[0]<1)RANGE[0]=Math.max(0,RANGE[1]-1);a=null;render()});
}

function cowHeat(s,id,metric="v"){

  const tot=Object.values(z).reduce((a,b)=>a+b,0)||1,mx=Math.max(...Object.values(z),1);
  const polys=Object.entries(REG).map(([k,r])=>{const a=z[k]/mx;const [cx,cy]=cen(r.pts);const pct=z[k]/tot*100;
    return `<polygon points="${r.pts.map(p=>p.join(",")).join(" ")}" data-z="${k}" fill="rgba(160,44,52,${(.12+.72*a).toFixed(2)})" data-tip="<b>${r.n}</b>${metric==="v"?km(z[k]):kg(z[k])+" kg"} · ${pct.toFixed(1)}%"></polygon>
    ${pct>0?`<g class="lb"><rect x="${cx-46}" y="${cy-20}" width="92" height="38" rx="19"/><text x="${cx}" y="${cy+9}" text-anchor="middle">${pct.toFixed(0)}%</text></g>`:""}`}).join("");
  return `<div class="cow" id="${id}"><img src="img/cortes.jpg" alt="Infografía de zonas de corte de la res" loading="lazy"><svg viewBox="0 0 1672 941">${polys}</svg></div>`;

    if(HF.pay==="pend"&&isPaid(o))return false;if(HF.pay==="ok"&&!isPaid(o))return false;

const CF={q:"",seg:"",sort:"v"};
function clientStats(){
  const st={};CL.forEach(c=>st[c.id]={v:0,n:0,last:0,bal:0,over:false,m:new Array(12).fill(0),cut:{}});
  const m0=T0-365*DAY;
  ALL().forEach(o=>{const s=st[o.c];s.v+=o.tot;s.n++;s.last=Math.max(s.last,o.t);if(!isPaid(o)){s.bal+=o.tot;if(T0-o.t>CX[o.c].term*DAY+DAY)s.over=true}
    if(o.t>=m0){const k=Math.min(11,Math.floor((o.t-m0)/(365*DAY/12)));s.m[k]+=o.tot}o.it.forEach(([pi,q])=>s.cut[pi]=(s.cut[pi]||0)+q)});
  const vs=Object.values(st).map(s=>s.v).sort((a,b)=>b-a),vip=vs[Math.floor(vs.length*.12)]||0;
  CL.forEach(c=>{const s=st[c.id],rec=(T0-s.last)/DAY;s.seg=s.v>=vip?"vip":rec<=21?"activo":rec<=75?"riesgo":"inactivo"});return st;
}
const SEG={vip:["VIP","p-gold"],activo:["Activo","p-ok"],riesgo:["En riesgo","p-warn"],inactivo:["Inactivo","p-mute"]};
V.clientes=()=>{
  const st=clientStats();
  let L=CL.filter(c=>(!CF.seg||st[c.id].seg===CF.seg)&&(!CF.q||c.name.toLowerCase().includes(CF.q.toLowerCase())));
  L.sort((a,b)=>CF.sort==="v"?st[b.id].v-st[a.id].v:CF.sort==="bal"?st[b.id].bal-st[a.id].bal:st[b.id].last-st[a.id].last);
  const cnt=k=>CL.filter(c=>st[c.id].seg===k).length;const bal=CL.reduce((a,c)=>a+st[c.id].bal,0),ov=CL.filter(c=>st[c.id].over).length;
  return banner("img/chef.jpg","Clientes y cartera",`${CL.length} clientes · ${km(bal)} por cobrar · ${ov} con facturas vencidas. Toca un cliente para ver su ficha completa.`,
   Object.keys(SEG).map(k=>`<button class="chip" style="border:1px solid rgba(255,255,255,.18);cursor:pointer;${CF.seg===k?"background:rgba(255,255,255,.3)":""}" data-act="cseg" data-v="${k}">${SEG[k][0]} <b>${cnt(k)}</b></button>`).join(""),"center 30%")+
  `<div class="filters card" style="margin-bottom:14px;border-bottom:1px solid var(--line)"><input class="inp search" id="cq" type="search" placeholder="Buscar cliente" value="${esc(CF.q)}" aria-label="Buscar cliente">
   <div class="seg">${[["v","Más compras"],["bal","Mayor saldo"],["last","Más recientes"]].map(([k,l])=>`<button type="button" data-act="csort" data-v="${k}" aria-pressed="${CF.sort===k}">${l}</button>`).join("")}</div>
   ${CF.seg?`<button class="btn sm" data-act="cseg" data-v="">Quitar filtro: ${SEG[CF.seg][0]}</button>`:""}</div>
  <div class="cgrid">${L.map(c=>{const s=st[c.id];return `<button type="button" class="card ccard" data-act="client" data-id="${c.id}">
    <div class="top">${avatar(c,40)}<div style="min-width:0"><b>${esc(c.name)}</b><span class="faint" style="font-size:12px">${c.type} · ${c.zone}</span></div></div>
    ${spark(s.m,c.type==="hogar"?"var(--sage)":"var(--wine)")}
    <div class="row"><span>Compras totales</span><b>${km(s.v)}</b></div><div class="row"><span>Pedidos</span><b>${int(s.n)}</b></div>
    <div class="row"><span>Saldo</span><b style="${s.over?"color:var(--bad)":""}">${km(s.bal)}</b></div>
    <div class="row" style="align-items:center"><span class="pill ${SEG[s.seg][1]}">${SEG[s.seg][0]}</span><span>Última: ${s.last?dmed(s.last):"—"}</span></div></button>`}).join("")||`<p class="empty">Sin clientes con ese filtro.</p>`}</div>`;
};
AFTER.clientes=()=>{let tm;$("#cq").addEventListener("input",e=>{clearTimeout(tm);tm=setTimeout(()=>{CF.q=e.target.value;render();const i=$("#cq");i.focus();i.setSelectionRange(i.value.length,i.value.length)},200)})};

 `<div class="kanban">${ST.map(([k,l,c])=>{const os=S.active.filter(o=>o.status===k);const v=os.reduce((a,o)=>a+totalOf(o),0);
   return `<div class="col" data-st="${k}"><h4><span>${l} · ${os.length}</span><span class="num">${km(v)}</span></h4>${os.map(o=>{const cl=CX[o.cid];return `<div class="oc" draggable="true" data-id="${o.id}">

    <div class="acts">${k!=="entregado"?`<button class="btn sm pri" data-act="adv" data-id="${o.id}">${{confirmado:"Alistar",alistamiento:"Despachar",enruta:"Entregado"}[k]} →</button>`:`<button class="btn sm" data-act="archive" data-id="${o.id}">Archivar al histórico</button>`}<button class="btn sm" data-act="aorder" data-id="${o.id}">Ver</button></div></div>`}).join("")||`<p class="faint" style="font-size:12px;text-align:center;padding:20px 0">Suelta aquí un pedido</p>`}</div>`}).join("")}</div>`;
AFTER.pedidos=()=>{
  let drag=null;
  $$(".oc").forEach(c=>{c.addEventListener("dragstart",e=>{drag=c.dataset.id;c.classList.add("drag");e.dataTransfer.effectAllowed="move";try{e.dataTransfer.setData("text/plain",drag)}catch(_){}});c.addEventListener("dragend",()=>c.classList.remove("drag"))});
  $$(".col").forEach(col=>{col.addEventListener("dragover",e=>{e.preventDefault();col.classList.add("over")});col.addEventListener("dragleave",()=>col.classList.remove("over"));
    col.addEventListener("drop",e=>{e.preventDefault();col.classList.remove("over");if(drag)moveOrder(drag,col.dataset.st)})});
};
function moveOrder(id,st){
  const o=S.active.find(x=>x.id===id);if(!o||o.status===st)return;
  const out=s=>s==="enruta"||s==="entregado";
  if(!out(o.status)&&out(st)){const sf=o.items.filter(i=>S.stock[i.pid]<i.q);if(sf.length){toast("No hay inventario físico de "+sf.map(i=>PX[i.pid].name).join(", ")+".");return}o.items.forEach(i=>S.stock[i.pid]=Math.round((S.stock[i.pid]-i.q)*10)/10)}
  if(out(o.status)&&!out(st))o.items.forEach(i=>S.stock[i.pid]=Math.round((S.stock[i.pid]+i.q)*10)/10);
  if(st!=="confirmado"&&!o.inv)o.inv="FE-5"+String(S.on++).padStart(4,"0");
  o.status=st;save();render();toast(`${o.id} → ${STX[st][1]}`);
}

    <p class="faint" style="font-size:12px">Conversión total: <b class="num" style="color:var(--ink)">${(conv/F[0][1]*100).toFixed(0)}%</b> de cotizaciones terminan en pedido.</p></div></section>
   <section class="card"><header><h3>Por responder</h3></header><div class="pb" style="display:grid;gap:10px">${S.quotes.filter(q=>q.status==="nueva").map(q=>`<div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><div><b>${esc(whoOf(q))}</b><div class="faint" style="font-size:12px">${q.id} · ${q.src} · ${km(totalOf(q))}</div></div><button class="btn sm pri" data-act="qconv" data-id="${q.id}">Convertir</button></div>`).join("")||`<p class="faint">Todo respondido.</p>`}</div></section></div>
  <section class="card"><div class="filters"><div class="seg">${["",...Object.keys(QST)].map(k=>`<button type="button" data-act="qf" data-v="${k}" aria-pressed="${qF===k}">${k?QST[k][0]:"Todas"} ${k?S.quotes.filter(q=>q.status===k).length:S.quotes.length}</button>`).join("")}</div></div>
   <div class="tbl"><table><thead><tr><th>N.º</th><th>Cliente</th><th>Cortes</th><th>Origen</th><th>Fecha</th><th>Estado</th><th class="r">Total</th><th></th></tr></thead><tbody>
   ${L.map(q=>{const sf=shortfall(q.items);const cl=q.cid?CX[q.cid]:null;return `<tr><td class="num">${q.id}</td><td><div class="cl">${cl?avatar(cl,30):`<div class="av" style="background:var(--ink-3);width:30px;height:30px">${esc(initials(q.lead.name))}</div>`}<div><b>${esc(whoOf(q))}</b><small>${cl?"Cliente registrado":"Prospecto · "+esc(q.lead.phone)}</small></div></div></td>
    <td><div class="thumbs">${q.items.map(i=>thumb(PX[i.pid],"th",52,52)).join("")}</div>${sf.length&&q.status!=="convertida"?`<small style="color:var(--bad);font-size:11.5px">Falta stock: ${esc(sf.join(", "))}</small>`:""}</td>
    <td><span class="tag">${q.src}</span></td><td>${dshort(q.date)}</td><td><span class="pill ${QST[q.status][1]}">${QST[q.status][0]}</span></td><td class="r num">${money(totalOf(q))}</td>
    <td class="r" style="white-space:nowrap">${q.status==="nueva"?`<button class="btn sm" data-act="qsend" data-id="${q.id}">Marcar enviada</button> `:""}${["nueva","enviada","aceptada"].includes(q.status)?`<button class="btn sm pri" data-act="qconv" data-id="${q.id}">Convertir</button>`:""}</td></tr>`}).join("")||`<tr><td colspan="8" class="empty">Sin cotizaciones en este estado.</td></tr>`}
   </tbody></table></div></section>`;
};

/* ---------- RUTAS ---------- */
let rDay=null;
V.rutas=()=>{
  const days=[...Array(7)].map((_,i)=>T0+i*DAY);
  if(rDay===null)rDay=days.find(d=>S.active.some(o=>o.deliver===d))||days[1];
  const dow=new Date(rDay).getDay();
  const day=S.active.filter(o=>o.deliver===rDay);
  const rs=Object.entries(ROUTES).filter(([k,r])=>r.days.includes(dow)||day.some(o=>o.route===k));
  const vol={};ALL().forEach(o=>{if(o.t>=T0-90*DAY){const z=CX[o.c].zone;vol[z]=(vol[z]||0)+1}});const vmax=Math.max(...Object.values(vol),1);
  const today={};day.forEach(o=>{const z=CX[o.cid].zone;today[z]=(today[z]||0)+1});
  const map=`<svg viewBox="0 0 520 420" role="img" aria-label="Mapa esquemático de rutas">
    <path class="river" d="M222 6 C246 100 206 180 236 262 S 214 372 228 416"/><text x="250" y="140" style="fill:var(--sky);font-size:10px;font-weight:600">Río Medellín</text>
    ${Object.entries(ZONES).map(([z,[rid,x,y]])=>{const on=rs.some(([k])=>k===rid);return `<path class="rl" d="M${BASE[0]} ${BASE[1]} Q ${(BASE[0]+x)/2+20} ${(BASE[1]+y)/2-30} ${x} ${y}" stroke="${ROUTES[rid].col}" opacity="${on?.85:.12}" style="${on?"":"animation:none"}"/>`}).join("")}
    ${Object.entries(ZONES).map(([z,[rid,x,y]])=>{const r=6+14*(vol[z]||0)/vmax,on=rs.some(([k])=>k===rid);return `<g data-tip="<b>${z}</b>Ruta ${ROUTES[rid].n} · ${ROUTES[rid].days.map(d=>DN[d]).join(", ")}<br>${vol[z]||0} pedidos en 90 días${today[z]?`<br>${today[z]} entregas este día`:""}">
      <circle class="zn" cx="${x}" cy="${y}" r="${r}" fill="${ROUTES[rid].col}" opacity="${on?.9:.3}"/>${today[z]?`<circle cx="${x}" cy="${y}" r="${r+6}" fill="none" stroke="${ROUTES[rid].col}" stroke-width="2"/>`:""}
      <text x="${x}" y="${y-r-5}" text-anchor="middle">${z}</text></g>`}).join("")}
    <g><rect x="${BASE[0]-34}" y="${BASE[1]-14}" width="68" height="28" rx="14" fill="var(--ink)"/><text x="${BASE[0]}" y="${BASE[1]+4}" text-anchor="middle" style="fill:var(--bg)">Bodega</text></g></svg>`;
  return head("Despachos en cadena de frío","Rutas")+
  `<div class="seg" style="margin-bottom:14px;flex-wrap:wrap">${days.map(d=>{const n=S.active.filter(o=>o.deliver===d).length;return `<button type="button" data-act="rd" data-v="${d}" aria-pressed="${d===rDay}">${dshort(d)}${n?` · ${n}`:""}</button>`}).join("")}</div>
  <div class="grid2e"><section class="card"><header><h3>Mapa de zonas</h3><div class="legend">${Object.values(ROUTES).map(r=>`<span><i style="background:${r.col}"></i>${r.n}</span>`).join("")}</div></header><div class="pb"><div class="rmap">${map}</div>
   <p class="faint" style="font-size:12px;margin-top:8px">El tamaño de cada punto es el volumen de pedidos de los últimos 90 días. Las rutas animadas son las que salen el día elegido.</p></div></section>
   <div class="stack">${rs.length?rs.map(([k,r])=>{const st=day.filter(o=>o.route===k);const kgs=st.reduce((a,o)=>a+o.items.filter(i=>PX[i.pid].unit==="kg").reduce((b,i)=>b+i.q,0),0);
    return `<section class="card"><header><div><h3 style="display:flex;align-items:center;gap:8px"><i style="width:10px;height:10px;border-radius:50%;background:${r.col};display:inline-block"></i>Ruta ${r.n}</h3><span class="faint" style="font-size:12px">${r.veh} · ${r.drv} · ${r.win}</span></div><span class="num">${kg(kgs)} kg</span></header>
    <div class="pb">${st.length?st.map((o,i)=>{const c=CX[o.cid];return `<div class="stop"><span class="n" style="background:${o.status==="entregado"?"var(--sage)":r.col}">${o.status==="entregado"?"✓":i+1}</span><div><b>${esc(c.name)}</b><div class="faint" style="font-size:12px">${c.zone} · ${c.phone} · ${o.id}</div></div>
     ${o.status==="enruta"?`<button class="btn sm pri" data-act="adv" data-id="${o.id}">Entregado</button>`:`<span class="pill ${STX[o.status][2]}">${STX[o.status][1]}</span>`}</div>`}).join(""):`<p class="faint">Sin paradas este día.</p>`}</div></section>`}).join(""):`<section class="card"><p class="empty">No salen rutas este día.</p></section>`}
   <section class="card"><header><h3>Manual de ruta</h3></header><div class="pb">
    <details class="man" open><summary>Antes de salir</summary><ol><li>Pre-enfriar el furgón a 0–4 °C mínimo 30 minutos.</li><li>Verificar empaque al vacío y etiqueta de lote en cada corte.</li><li>Registrar temperatura del cuarto frío y del furgón.</li><li>Cargar en orden inverso a las paradas.</li></ol></details>
    <details class="man"><summary>En la ruta</summary><ol><li>Abrir el furgón máximo 2 minutos por parada.</li><li>Si la temperatura pasa de 7 °C, avisar al coordinador antes de entregar.</li><li>En restaurantes, entregar al responsable de recibo.</li></ol></details>
    <details class="man"><summary>En la entrega</summary><ol><li>El cliente verifica peso y estado; se anota el peso real.</li><li>Firma o foto de recibido y marcar la parada en el sistema.</li><li>Diferencias de peso mayores a 3% se ajustan en la factura.</li></ol></details>
    <details class="man"><summary>Devoluciones</summary><ol><li>Solo con empaque intacto y cadena de frío verificada.</li><li>Se registran con número de lote para calidad.</li></ol></details></div></section></div></div>`;
};

/* ---------- INVENTARIO ---------- */
V.inventario=()=>{
  const since=T0-56*DAY,rot={};HIST.forEach(o=>{if(o.t>=since)o.it.forEach(([pi,q])=>rot[pi]=(rot[pi]||0)+q)});
  const cards=P.map((p,pi)=>{const a=avail(p.id),rv=reserved(p.id),perDay=(rot[pi]||0)/56,cov=perDay?a/perDay:99,pct=Math.max(0,Math.min(1,a/(p.min*3)));
    const col=a<=0||cov<2?"var(--bad)":cov<5||a<p.min?"var(--warn)":"var(--sage)";const C=2*Math.PI*26;
    return `<article class="card icard"><div class="ph">${p.img?`<img src="${p.img}" alt="${p.name}" loading="lazy">`:`<canvas width="300" height="140" data-m="${p.m}" data-s="${hash(p.id)}"></canvas>`}<span class="tag ${p.line}">${p.line==="wagyu"?"F1 Wagyu":"Brahman"}</span>
     <div class="ring" data-tip="<b>Disponible</b>${kg(a)} ${p.unit} de ${p.min*3} objetivo"><svg viewBox="0 0 56 56"><circle cx="28" cy="28" r="26" fill="none" stroke="var(--sunk)" stroke-width="4"/><circle cx="28" cy="28" r="26" fill="none" stroke="${col}" stroke-width="4" stroke-linecap="round" stroke-dasharray="${(C*pct).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 28 28)"/></svg><b>${Math.round(pct*100)}%</b></div></div>
     <div class="bd"><h3>${p.name}</h3><div class="kv"><div><span>Físico</span><b>${kg(S.stock[p.id])}</b></div><div><span>Reservado</span><b>${kg(rv)}</b></div><div><span>Disponible</span><b style="color:${col}">${kg(a)}</b></div></div>
     <div style="display:flex;justify-content:space-between;align-items:center;font-size:12.5px"><span class="faint">Venta ${kg(perDay*7)} ${p.unit}/sem</span><span class="pill ${cov<2||a<=0?"p-bad":cov<5?"p-warn":"p-ok"}">${a<=0?"Agotado":cov>=99?"Sin rotación":"Cubre "+kg(cov)+" días"}</span></div>
     <div class="acts"><button class="btn sm" data-act="adj" data-id="${p.id}">Ajustar</button><button class="btn sm" data-act="cut" data-id="${p.id}">Historial</button></div></div></article>`}).join("");

     const it=o.items.map(x=>[P.findIndex(p=>p.id===x.pid),x.q,PX[x.pid].price]);
     S.done.push({id:o.id,c:o.cid,t:Math.min(o.deliver,T0-1),it,tot:totalOf(o),kg:o.items.filter(x=>PX[x.pid].unit==="kg").reduce((a,x)=>a+x.q,0),paid:o.paid,src:o.src,inv:o.inv||"FE-—"});
     S.active.splice(i,1);save();buildMonths();render();toast(`${o.id} archivado en el histórico`)},
   qf:()=>{qF=v;render()},
   qsend:()=>{S.quotes.find(q=>q.id===id).status="enviada";save();render();toast("Cotización marcada como enviada")},
   qconv:()=>{const q=S.quotes.find(x=>x.id===id);let cid=q.cid;
     if(!cid){const L=q.lead;const zone=L.zone in ZONES?L.zone:"El Poblado";const c={id:"C"+String(CL.length+1).padStart(3,"0"),name:L.name,type:L.type==="evento"?"hogar":L.type,zone,route:ZONES[zone][0],w:1,wg:.5,disc:L.type==="restaurante"?5:0,term:0,since:T0,until:null,phone:L.phone,col:AVC[CL.length%AVC.length]};CL.push(c);CX[c.id]=c;cid=c.id}
     const sf=shortfall(q.items);const o=createOrder(cid,q.items.map(i=>({...i})),q.src);q.status="convertida";q.cid=cid;save();render();
     toast(`${o.id} creado para ${dshort(o.deliver)}${sf.length?". Revisa stock de "+sf.join(", "):""}`)},
   togRec:()=>{const r=S.recurring.find(x=>x.id===id);r.active=!r.active;save();render();toast(`${CX[r.cid].name}: ${r.active?"activo":"pausado"}`)},
   genRec:()=>{const due=S.recurring.filter(r=>r.active&&r.next<=T0+7*DAY);const w=[];due.forEach(r=>{if(shortfall(r.items).length)w.push(CX[r.cid].name);const o=createOrder(r.cid,r.items.map(i=>({...i})),"recurrente");o.deliver=r.next;r.next+=7*DAY});
     save();render();toast(`${due.length} pedidos generados${w.length?". Con faltantes: "+w.join(", "):""}`)},
   rd:()=>{rDay=+v;render()},
   addrow:()=>{const n=$$("#ib .irow").length+Date.now()%1000;$("#ib").insertAdjacentHTML("beforeend",itemRow(n,"b-punta",1))},
   delrow:()=>b.closest(".irow").remove(),
   newOrder:()=>openBox(formBox("Nuevo pedido",`<label>Cliente<select class="inp" id="mc">${clientOpts(c=>!c.until)}</select></label>${itemsBlock(itemRow(1))}`,"Crear pedido"),()=>{const it=readItems();if(!it.length)return"Agrega al menos un corte.";const o=createOrder($("#mc").value,it);save();render();toast(`${o.id} para ${dshort(o.deliver)}`)}),
   newQuote:()=>openBox(formBox("Nueva cotización",`<label>Cliente<select class="inp" id="mc">${clientOpts()}</select></label>${itemsBlock(itemRow(1,"b-punta",3))}`,"Guardar"),()=>{const it=readItems();if(!it.length)return"Agrega al menos un corte.";S.quotes.push({id:"COT-"+(S.qn++),cid:$("#mc").value,items:it,date:T0,status:"nueva",src:"directo"});save();render();toast("Cotización creada")}),
   newRec:()=>openBox(formBox("Nuevo pedido recurrente",`<div class="two"><label>Cliente<select class="inp" id="mc">${clientOpts(c=>c.type!=="hogar"&&!c.until)}</select></label><label>Día de entrega<select class="inp" id="md">${[1,2,3,4,5,6].map(d=>`<option value="${d}">${DN[d]}</option>`).join("")}</select></label></div>${itemsBlock(itemRow(1,"w-ribeye",4))}`,"Programar"),()=>{const it=readItems();if(!it.length)return"Agrega al menos un corte.";const d=+$("#md").value;S.recurring.push({id:"RC-"+String(S.recurring.length+1).padStart(2,"0"),cid:$("#mc").value,dow:d,items:it,active:true,next:nextDow(d)});save();render();toast("Recurrente programado")}),
   adj:()=>{const p=PX[id];openBox(formBox("Ajustar "+p.name,`<label>Inventario físico contado (${p.unit})<input class="inp" id="mq" type="number" step="0.5" value="${S.stock[id]}"></label><label>Motivo<select class="inp" id="mr"><option>Conteo físico</option><option>Merma</option><option>Devolución</option><option>Degustación</option></select></label>`,"Guardar ajuste"),()=>{const x=parseFloat($("#mq").value);if(isNaN(x)||x<0)return"Escribe una cantidad válida.";const r=$("#mr").value;S.stock[id]=x;save();render();toast(`${p.name}: ${kg(x)} ${p.unit} · ${r}`)})},
   entry:()=>openBox(formBox("Entrada de lote",`<div class="two"><label>Línea<select class="inp" id="ml"><option value="wagyu">F1 Wagyu × Brahman</option><option value="brahman">Brahman 100%</option></select></label><label>Animal<input class="inp" id="ma" value="Novillo #${4500+S.lots.length}"></label></div><div class="two"><label>Kg en canal<input class="inp" id="mk" type="number" value="300"></label><label>Días de maduración<input class="inp" id="mg" type="number" value="21"></label></div>${itemsBlock(itemRow(1,"w-ribeye",10)+itemRow(2,"w-strip",8))}`,"Registrar entrada"),()=>{
     const it=readItems();if(!it.length)return"Agrega los cortes que entran.";it.forEach(i=>S.stock[i.pid]=Math.round((S.stock[i.pid]+i.q)*10)/10);
     const line=$("#ml").value;S.lots.unshift({id:"L-"+new Date().toISOString().slice(2,4)+String(new Date().getMonth()+1).padStart(2,"0")+"-"+String(11+S.lots.length).padStart(2,"0"),line,animal:$("#ma").value,slaughter:T0,carcass:+$("#mk").value||300,aging:+$("#mg").value||21,temp:2,y:line==="wagyu"?[35,29,18,18]:[25,37,22,16]});save();render();toast("Lote registrado")})
  };
  if(A[a]){e.preventDefault();A[a]()}
});
document.addEventListener("keydown",e=>{const t=e.target.closest&&e.target.closest(".rchip");if(t&&(e.key==="Enter"||e.key===" ")){e.preventDefault();t.click()}});
$("#resetData").addEventListener("click",()=>{S=seedState();save();buildMonths();RANGE=[MONTHS.length-12,MONTHS.length-1];rDay=null;render();toast("Datos de ejemplo restaurados")});

let tt;function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),2800)}
window.__adm={S:()=>S,HIST,MONTHS:()=>MONTHS,CL};
render();
})();
</script>
